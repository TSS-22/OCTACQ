[package]
name = "sai_1_adcusb"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

defmt = "1.2.0"
defmt-rtt = "1.3.1"

embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", features = ["defmt", "stm32h723vg", "time-driver-tim2", "memory-x", "unstable-pac"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-1_000_000"] }

embedded-io-async = "0.7.0"

panic-probe = { version = "1.0.0", features = ["print-defmt"] }
