[package]
name = "blink_stm32h723"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.9", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = {version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"]}
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h723vg", "unstable-pac", "memory-x", "time-driver-any"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }